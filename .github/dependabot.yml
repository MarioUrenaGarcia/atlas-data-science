version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node type definitions must match the runtime major pinned in .nvmrc;
      # newer majors would type-check APIs that the runtime lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
