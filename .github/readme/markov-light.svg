<svg xmlns="http://www.w3.org/2000/svg" width="580" height="300" viewBox="0 0 580 300" role="img" aria-label="Ficha que salta entre los estados de una cadena de Markov">
<title>Ficha que salta entre los estados de una cadena de Markov</title>
<rect width="580" height="300" rx="18" fill="#fbfbfa"/>
